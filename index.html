function pesos(n){return "$"+Number(n).toLocaleString("es-CL")}function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function waLink(p){return "https://wa.me/"+WA+"?text="+encodeURIComponent("Hola, me interesa este modelo:\n"+p.name+"\nPrecio: "+pesos(p.price))}
function initCategories(){document.getElementById("catScroller").innerHTML=CATCARDS.map(c=>`<article class="catCard" onclick="setCategory('${esc(c.name)}')"><img src="${c.image}" alt="${esc(c.name)}" referrerpolicy="no-referrer"><div class="catFoot"><b>${esc(c.name)}</b><span>Ver modelos</span></div></article>`).join("");document.getElementById("menuList").innerHTML='<button onclick="setCategory(\'\')"><b>Todo el catálogo</b><span>'+PRODUCTS.length+'</span></button>'+CATCARDS.map(c=>`<button onclick="setCategory('${esc(c.name)}')"><b>${esc(c.name)}</b><span>${c.count}</span></button>`).join("");}
function openDrawer(){document.getElementById("drawer").classList.add("open")}function closeDrawer(){document.getElementById("drawer").classList.remove("open")}function focusSearch(){document.getElementById("search").focus()}function setCategory(c){activeCategory=c;closeDrawer();document.getElementById("search").value="";resetRender();window.scrollTo({top:0,behavior:"smooth"})}
function makeList(){const q=norm(document.getElementById("search").value);return PRODUCTS.filter(p=>(!activeCategory||p.category===activeCategory)&&(!q||norm(p.name+" "+p.category+" "+p.subcat).includes(q)));}
function resetRender(){filtered=makeList();visible=0;document.getElementById("grid").innerHTML="";loadMore(true);}
function loadMore(first=false){const start=visible,end=Math.min(visible+STEP,filtered.length);let html="";for(let i=start;i<end;i++){const p=filtered[i];html+=`<article class="card"><div class="pic"><img loading="lazy" referrerpolicy="no-referrer" src="${p.image}" alt="${esc(p.name)}"></div><div class="body"><div class="name">${esc(p.name)}</div><div class="cat">${esc(p.category)}</div><div class="price">${pesos(p.price)}</div><div class="btns"><button onclick="openProduct(${p.id})">Ver detalle</button><a target="_blank" href="${waLink(p)}">WhatsApp</a></div></div></article>`;}visible=end;const grid=document.getElementById("grid");if(start===0)grid.innerHTML=html;else grid.insertAdjacentHTML("beforeend",html);const label=activeCategory||(document.getElementById("search").value?"Búsqueda":"Todo");document.getElementById("count").textContent=filtered.length+" modelos visibles";document.getElementById("current").textContent=label;document.getElementById("selectLabel").textContent=activeCategory||"Todas las categorías";document.getElementById("empty").style.display=filtered.length?"none":"block";document.getElementById("more").style.display=visible<filtered.length?"block":"none";}
function openProduct(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return;const imgs=(p.images&&p.images.length?p.images:[p.image]).map(src=>`<img referrerpolicy="no-referrer" src="${src}" alt="${esc(p.name)}">`).join("");document.getElementById("modalContent").innerHTML=`<div class="modalgrid"><div>${imgs}</div><div><h2>${esc(p.name)}</h2><p class="cat">${esc(p.category)}</p><div class="price">${pesos(p.price)}</div><p>Modelo disponible para pedido. Consulta tallas y disponibilidad.</p><a class="whatsappBig" target="_blank" href="${waLink(p)}">Consultar por WhatsApp</a></div></div>`;document.getElementById("modal").classList.add("open");}function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("search").addEventListener("input",resetRender);initCategories();resetRender();
</script></body></html>
